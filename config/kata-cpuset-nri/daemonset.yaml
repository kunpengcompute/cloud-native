apiVersion: v1
kind: Namespace
metadata:
  name: kata-cpuset-nri
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kata-cpuset-nri
  namespace: kata-cpuset-nri
  labels:
    app: kata-cpuset-nri
spec:
  selector:
    matchLabels:
      app: kata-cpuset-nri
  template:
    metadata:
      labels:
        app: kata-cpuset-nri
    spec:
      priorityClassName: system-node-critical
      tolerations:
      - operator: Exists
      containers:
      - name: kata-cpuset-nri
        image: kata-cpuset-nri:latest
        imagePullPolicy: IfNotPresent
        args:
        - --nri-socket-path=/var/run/nri/nri.sock
        - --scan-interval=10s
        - --namespace-whitelist=default
        - --runtimeclass-whitelist=kata
        - --dry-run=true
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: nri-socket
          mountPath: /var/run/nri
        - name: sys
          mountPath: /sys
          readOnly: true
          mountPropagation: HostToContainer
        - name: cgroup
          mountPath: /sys/fs/cgroup
          mountPropagation: HostToContainer
      volumes:
      - name: nri-socket
        hostPath:
          path: /var/run/nri
          type: Directory
      - name: sys
        hostPath:
          path: /sys
          type: Directory
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
          type: Directory
