apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kae-admission-webhook
webhooks:
  - name: kae-injection.kunpeng.com
    admissionReviewVersions:
      - v1beta1
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        name: kae-admission-webhook
        namespace: kae-system
        path: /mutate--v1-pod
        port: 443
      caBundle: ""
    namespaceSelector:
      matchExpressions:
        - key: kae.kunpeng.com/webhook
          operator: NotIn
          values:
            - disabled
    rules:
      - operations:
          - CREATE
          - UPDATE
        apiGroups:
          - ""
        apiVersions:
          - v1
        resources:
          - pods
