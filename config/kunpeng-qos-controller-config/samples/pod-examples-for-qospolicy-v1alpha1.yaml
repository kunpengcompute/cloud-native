apiVersion: v1
kind: Pod
metadata:
  name: offline-small-nginx
  labels:
    app: nginx
    qos.kunpeng.huawei.com/group: offline-small
    qos.kunpeng.huawei.com/workload-class: offline
spec:
  containers:
  - name: nginx
    image: nginx:1.25
---
apiVersion: v1
kind: Pod
metadata:
  name: offline-large-stress
  labels:
    app: stress
    qos.kunpeng.huawei.com/group: offline-large
    qos.kunpeng.huawei.com/workload-class: offline
spec:
  containers:
  - name: stress
    image: alpine:3.20
    command: ["sh", "-c", "while true; do dd if=/dev/zero of=/dev/null bs=1M count=512; done"]
---
apiVersion: v1
kind: Pod
metadata:
  name: latency-sensitive-worker
  labels:
    app: worker
    qos.kunpeng.huawei.com/group: latency-sensitive
    qos.kunpeng.huawei.com/workload-class: online
spec:
  containers:
  - name: worker
    image: busybox:1.36
    command: ["sh", "-c", "while true; do echo work; sleep 1; done"]
