apiVersion: v1
kind: Namespace
metadata:
  name: qos-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qos-controller
  namespace: qos-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: qos-controller
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["qos.kunpeng.huawei.com"]
  resources: ["qospolicies"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["qos.kunpeng.huawei.com"]
  resources: ["qospolicies/finalizers"]
  verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: qos-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: qos-controller
subjects:
- kind: ServiceAccount
  name: qos-controller
  namespace: qos-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: qos-controller
  namespace: qos-system
spec:
  selector:
    matchLabels:
      app: qos-controller
  template:
    metadata:
      labels:
        app: qos-controller
    spec:
      serviceAccountName: qos-controller
      hostPID: true
      containers:
      - name: qos-controller
        # 请替换为实际使用的镜像仓库和版本。
        image: kunpeng-qos-controller:0.1.0
        imagePullPolicy: IfNotPresent
        command: ["/usr/bin/kunpeng-qos-controller"]
        args:
        - --enable-dynamic-control=true
        - --dynamic-agent-addr=http://127.0.0.1:18080
        - --dynamic-publish-interval=30s
        - --dynamic-apply-interval=30s
        - --dynamic-task-timeout=10s
        securityContext:
          capabilities:
            add:
            - SYS_ADMIN
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        volumeMounts:
        - name: resctrl
          mountPath: /sys/fs/resctrl
        - name: cgroup
          mountPath: /sys/fs/cgroup
      - name: interference-agent
        # 镜像中需要包含 libkperf 和默认的本地模型文件。
        image: waas-agent:latest
        imagePullPolicy: IfNotPresent
        args:
        - --analysis-mode=local
        - --http-host=127.0.0.1
        - --http-port=18080
        securityContext:
          privileged: true
      volumes:
      - name: resctrl
        hostPath:
          path: /sys/fs/resctrl
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
