apiVersion: v1
kind: Namespace
metadata:
  name: mpam-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mpam-controller
  namespace: mpam-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mpam-controller
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["qos.kunpeng.huawei.com"]
  resources: ["qospolicies"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["qos.kunpeng.huawei.com"]
  resources: ["qospolicies/finalizers"]
  verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mpam-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mpam-controller
subjects:
- kind: ServiceAccount
  name: mpam-controller
  namespace: mpam-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mpam-controller
  namespace: mpam-system
spec:
  selector:
    matchLabels:
      app: mpam-controller
  template:
    metadata:
      labels:
        app: mpam-controller
    spec:
      serviceAccountName: mpam-controller
      hostPID: true
      containers:
      - name: mpam-controller
        # Replace with your actual registry/image tag.
        image: k8s-mpam-controller:0.1.0
        imagePullPolicy: IfNotPresent
        command: ["/usr/bin/agent"]
        securityContext:
          capabilities:
            add:
            - SYS_ADMIN
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        volumeMounts:
        - name: resctrl
          mountPath: /sys/fs/resctrl
        - name: cgroup
          mountPath: /sys/fs/cgroup
      volumes:
      - name: resctrl
        hostPath:
          path: /sys/fs/resctrl
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
