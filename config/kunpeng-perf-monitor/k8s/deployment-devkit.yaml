# kunpeng-perf-monitor DevKit 独立部署清单
#
# 该清单仅启用 devkit-topdown 和 devkit-memory，不创建
# ServiceMonitor 或 Prometheus scrape annotation。部署后可在节点上访问：
#   curl http://<node-ip>:30010/metrics
#
# 本清单与 devkit-prometheus/deployment.yaml 互斥，切换前应先删除
# 当前清单，避免同时运行两组 DevKit CLI 采集。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kunpeng-perf-monitor
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kunpeng-perf-monitor-config-reader
  namespace: default
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["kunpeng-perf-monitor-devkit-config"]
  verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kunpeng-perf-monitor-config-reader
  namespace: default
subjects:
- kind: ServiceAccount
  name: kunpeng-perf-monitor
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kunpeng-perf-monitor-config-reader
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kunpeng-perf-monitor-devkit-config
  namespace: default
data:
  devkit-tuner.yaml: |
    topdown:
      cpu: ""          # 与 pid 互斥；均为空时进行 system scope 采集
      pid: ""          # 纯数字或数字列表，不接受 "ALL"
      duration: 3      # 采集时长（秒），仅允许 1-5 的整数
    memory:
      cpu: ""          # 为空时采集所有 CPU；Memory 不支持 pid/cgroup
      duration: 3      # 采集时长（秒），仅允许 1-5 的整数
      period: 1000     # 仅允许 100/1000 ms；duration=1 时必须为 100
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kunpeng-perf-monitor-devkit
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kunpeng-perf-monitor
      app.kubernetes.io/component: devkit-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kunpeng-perf-monitor
        app.kubernetes.io/component: devkit-collector
    spec:
      serviceAccountName: kunpeng-perf-monitor
      hostPID: true
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
      - name: kunpeng-perf-monitor
        image: kunpeng-perf-monitor:1.0
        imagePullPolicy: IfNotPresent
        args:
        - --collector.disable-defaults
        - --collector.devkit-topdown
        - --collector.devkit-memory
        - --web.listen-address=:9100
        ports:
        - name: metrics
          containerPort: 9100
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - SYS_ADMIN
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: cpu-devices
          mountPath: /sys/devices/system/cpu
          readOnly: true
        - name: event-devices
          mountPath: /sys/bus/event_source/devices
          readOnly: true
      volumes:
      - name: cpu-devices
        hostPath:
          path: /sys/devices/system/cpu
          type: Directory
      - name: event-devices
        hostPath:
          path: /sys/bus/event_source/devices
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: kunpeng-perf-monitor-devkit
  namespace: default
  labels:
    app.kubernetes.io/name: kunpeng-perf-monitor
    app.kubernetes.io/component: devkit-collector
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kunpeng-perf-monitor
    app.kubernetes.io/component: devkit-collector
  ports:
  - name: metrics
    port: 9100
    targetPort: 9100
    nodePort: 30010
