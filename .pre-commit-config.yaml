# pre-commit配置，首次使用需执行以下命令确保生效，可在代码提交前拦截并检查
# pip install pre-commit  # 安装pre-commit工具
# pre-commit install  # 安装git hook，请在代码仓根目录执行
repos:
  # ===================== 通用基础钩子（所有语言） =====================
  #- repo: https://github.com/pre-commit/pre-commit-hooks
  - repo: https://gitcode.com/gh_mirrors/pr/pre-commit-hooks # 使用gitcode镜像加速
    rev: v6.0.0
    hooks:
      #- id: trailing-whitespace # 移除行尾空白字符
      - id: check-yaml # 校验 YAML 文件语法
        args: ["--allow-multiple-documents"] # 允许YAML文件中包含多个文档
      - id: check-json # 校验 JSON 文件语法
      - id: check-xml # 校验 XML 文件语法
      - id: check-merge-conflict # 检查未解决的合并冲突标记
      - id: detect-private-key # 检测私钥/敏感信息泄露
      - id: check-added-large-files # 拦截超大文件提交（默认500KB）
        # 仅允许独立 runtime 交付和 go:embed 必需的三个二进制文件超限。
        exclude: >-
          ^TemplateCreator/(runtime-assets/bundled/envd/0\.5\.3/(amd64|arm64)/envd|internal/upstream/orchestrator/pkg/template/build/core/systeminit/busybox_1\.36\.1-2)$
      #  args: ["--maxkb", "500"]  # 支持自定义修改
      - id: no-commit-to-branch # 禁止直接提交到main/master分支

  # ===================== 敏感信息扫描 =====================
  #- repo: https://github.com/Yelp/detect-secrets
  - repo: https://gitcode.com/gh_mirrors/de/detect-secrets # 使用gitcode镜像加速
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # baseline 仅记录已核对误报，新增疑似凭据继续接受检查。
        args: ["--baseline", ".secrets.baseline"]
        # 以下upstream快照文件为已人工核实的固定算法常量/标识正则，按文件排除，
        # 避免其行号随快照调整偏移而需要反复同步baseline。
        exclude: ^TemplateCreator/internal/upstream/(shared/pkg/id/id|shared/pkg/keys/constants)\.go$

  # ===================== Go 语言 ==========
  - repo: https://gitcode.com/gh_mirrors/go/golangci-lint # 使用gitcode镜像加速
    rev: v2.12.2
    hooks:
      - id: golangci-lint-full
