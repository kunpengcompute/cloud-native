apiVersion: v1
kind: Pod
metadata:
  name: kae-test-qos
  annotations:
    qos.kae.kunpeng.com/hisi_hpre: "500"
    qos.kae.kunpeng.com/hisi_sec2: "600"
    qos.kae.kunpeng.com/hisi_zip:  "700"
spec:
  containers:
  - name: kae-test-qos
    image: kae-test:latest
    command: ["/bin/sh", "-c", "while true; do echo hello; sleep 300000; done"]
    imagePullPolicy: IfNotPresent
    env:
      - name: OPENSSL_CONF
        value: /home/openssl.cnf
    resources:
      requests:
        cpu: "4"
        memory: "16Gi"
        kae.kunpeng.com/hisi_hpre: "1"
        kae.kunpeng.com/hisi_sec2: "1"
        kae.kunpeng.com/hisi_zip: "1"
      limits:
        cpu: "4"
        memory: "16Gi"
        kae.kunpeng.com/hisi_hpre: "1"
        kae.kunpeng.com/hisi_sec2: "1"
        kae.kunpeng.com/hisi_zip: "1"
    volumeMounts:
      - name: local-lib
        mountPath: /usr/local
  volumes:
    - name: local-lib
      hostPath:
        path: /usr/local