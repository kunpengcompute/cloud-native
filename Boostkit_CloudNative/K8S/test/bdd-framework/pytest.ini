[pytest]
# kunpeng-tap BDD 测试框架的 pytest 配置

# 测试发现模式
testpaths = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# BDD 特定配置
# bdd_features_base_dir = features  # 注释掉，避免路径重复

# 通用测试标记
markers =
    # 测试类型
    e2e: End-to-end tests that require a real cluster
    unit: Unit tests that can run in isolation
    integration: Integration tests that require multiple components
    slow: Tests that take a long time to run
    flaky: Tests that may fail intermittently
    smoke: Quick smoke tests
    regression: Regression tests
    performance: Performance tests
    critical: Critical tests that must pass
    topology_aware: Topology-aware scheduling tests
    numa_aware: NUMA-aware scheduling tests
    containerd: Containerd integration tests

    # QoS 类型标记
    guaranteed: Guaranteed QoS type tests
    guaranteed_qos: Guaranteed QoS type tests
    burstable: Burstable QoS type tests
    burstable_qos: Burstable QoS type tests
    besteffort: BestEffort QoS type tests
    besteffort_qos: BestEffort QoS type tests
    qos_classification: QoS classification tests

    # NUMA 拓扑标记
    2numa: 2-NUMA topology tests
    4numa: 4-NUMA topology tests

    # 机器配置标记
    standard: Standard machine configuration tests
    high_perf: High performance machine configuration tests

    # 拓扑亲和标记
    affinity_expected: Tests expecting topology affinity
    no_affinity_expected: Tests expecting no topology affinity
    no_affinity: No affinity tests
    numa_affinity: NUMA affinity tests
    socket_affinity: Socket affinity tests
    cross_numa: Cross-NUMA scheduling tests
    cross_socket: Cross-socket scheduling tests
    single_numa: Single NUMA node tests
    multi_replica: Multiple replica deployment tests
    load_balance: Load balancing tests

    # 批量部署标记
    ; bulk_deployment: Bulk deployment tests
    ; bulk_guaranteed_small: Bulk deployment with small guaranteed containers
    ; bulk_guaranteed_medium: Bulk deployment with medium guaranteed containers
    ; bulk_burstable: Bulk deployment with burstable containers
    ; bulk_besteffort: Bulk deployment with besteffort containers
    ; bulk_mixed_qos: Bulk deployment with mixed QoS types
    ; bulk_stress_test: Bulk deployment stress tests
    ; bulk_4numa_guaranteed_small: Bulk deployment on 4NUMA with small guaranteed containers
    ; bulk_4numa_guaranteed_medium: Bulk deployment on 4NUMA with medium guaranteed containers
    ; bulk_4numa_burstable: Bulk deployment on 4NUMA with burstable containers
    ; bulk_4numa_besteffort: Bulk deployment on 4NUMA with besteffort containers
    ; bulk_4numa_mixed_qos: Bulk deployment on 4NUMA with mixed QoS
    ; bulk_4numa_stress_test: Bulk deployment stress tests on 4NUMA
    ; small_containers: Small container tests
    ; medium_containers: Medium container tests
    ; elastic_containers: Elastic container tests
    ; numa_balance: NUMA load balancing tests
    ; mixed_qos: Mixed QoS tests

    # 混合部署标记
    mixed_deployment: Mixed deployment tests
    resource_competition: Resource competition scenario tests
    load_balancing: Load balancing tests
    numa_switch: NUMA switching tests
    socket_switch: Socket switching tests
    resource_shortage: Resource shortage scenario tests
    large_container: Large container tests
    avoid_occupied: Avoid occupied resources tests

    # 边界条件标记
    boundary_condition: Boundary condition tests
    boundary_min_guaranteed: Minimum guaranteed resource tests
    boundary_full_numa: Full NUMA capacity tests
    boundary_exceed_numa: Exceed NUMA capacity tests
    min_resource: Minimum resource request tests
    resource_overflow: Resource overflow tests
    millicores: Millicores unit tests
    decimal_cpu: Decimal CPU tests
    unit_conversion: Unit conversion tests
    max_numa_capacity: Maximum NUMA capacity tests
    max_socket_capacity: Maximum socket capacity tests
    exceed_numa_by_one: Exceed NUMA by one container tests
    exceed_socket_by_one: Exceed socket by one container tests
    request_limit_diff: Request and limit difference tests

    # 2NUMA 特定场景标记
    2numa_guaranteed_small: 2NUMA guaranteed small container tests
    2numa_guaranteed_medium: 2NUMA guaranteed medium container tests
    2numa_guaranteed_large: 2NUMA guaranteed large container tests
    2numa_guaranteed_near_full: 2NUMA guaranteed near full NUMA tests
    2numa_guaranteed_full_numa: 2NUMA guaranteed full NUMA tests
    2numa_guaranteed_cross_numa: 2NUMA guaranteed cross-NUMA tests
    2numa_guaranteed_large_cross_numa: 2NUMA guaranteed large cross-NUMA tests
    2numa_guaranteed_full_machine: 2NUMA guaranteed full machine tests
    2numa_burstable_small: 2NUMA burstable small container tests
    2numa_burstable_medium: 2NUMA burstable medium container tests
    2numa_burstable_large: 2NUMA burstable large container tests
    2numa_besteffort: 2NUMA besteffort container tests
    2numa_besteffort_no_affinity: 2NUMA besteffort no affinity tests

    # 4NUMA 特定场景标记
    4numa_guaranteed_small: 4NUMA guaranteed small container tests
    4numa_guaranteed_medium: 4NUMA guaranteed medium container tests
    4numa_guaranteed_large: 4NUMA guaranteed large container tests
    4numa_guaranteed_near_full: 4NUMA guaranteed near full NUMA tests
    4numa_guaranteed_full_numa: 4NUMA guaranteed full NUMA tests
    4numa_guaranteed_cross_numa_same_socket: 4NUMA guaranteed cross-NUMA same socket tests
    4numa_guaranteed_full_socket: 4NUMA guaranteed full socket tests
    4numa_guaranteed_cross_socket: 4NUMA guaranteed cross-socket tests
    4numa_guaranteed_full_machine: 4NUMA guaranteed full machine tests
    4numa_burstable_small: 4NUMA burstable small container tests
    4numa_burstable_medium: 4NUMA burstable medium container tests
    4numa_burstable_large: 4NUMA burstable large container tests
    4numa_besteffort: 4NUMA besteffort container tests

    # 边界条件特定标记
    boundary_besteffort_no_affinity: Boundary BestEffort no affinity tests
    boundary_memory_intensive: Boundary memory intensive tests

    # NUMA-Aware 测试用例编号标记
    4n_01: 4NUMA test case 01
    4n_02: 4NUMA test case 02
    4n_03: 4NUMA test case 03
    4n_04: 4NUMA test case 04
    4n_08: 4NUMA test case 08
    4n_09: 4NUMA test case 09
    4n_10: 4NUMA test case 10
    4n_11: 4NUMA test case 11
    4n_12: 4NUMA test case 12

    # 故障恢复标记
    failure_recovery: Failure recovery tests
    tap_restart: kunpeng-tap plugin restart tests
    container_restart: Container restart tests
    containerd_restart: containerd runtime restart tests

    # 自定义资源演示标记
    demo: Demo tests showcasing framework features
    custom-resource: Custom resource tests (GPU, FPGA, etc.)
    gpu: GPU resource tests
    fpga: FPGA resource tests
    annotation: Annotation configuration tests
    env-vars: Environment variable tests
    combined: Combined configuration tests
    multi-custom-resource: Multiple custom resource tests

# 测试输出配置
addopts =
    --strict-markers
    --tb=short
    --color=yes

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:kubernetes.*
