# 压力测试配置
stress_test_config:
  max_concurrent_deployments: 200
  deployment_timeout: 600  # 10分钟
  verification_timeout: 300  # 5分钟
  cleanup_timeout: 180  # 3分钟
  
# 验证方法配置
validation_config:
  numa_balance_check:
    tolerance: 0.2  # 20% 容忍度
    check_interval: 30  # 30秒检查间隔
  affinity_verification:
    check_cpuset: true
    check_memory_policy: true
  performance_metrics:
    collect_scheduling_latency: true
    collect_resource_utilization: true
  stress_test_metrics:
    collect_throughput: true
    collect_error_rate: true
    collect_resource_contention: true
