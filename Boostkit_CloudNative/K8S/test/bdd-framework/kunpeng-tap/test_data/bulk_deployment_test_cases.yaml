# kunpeng-tap 批量部署测试用例配置
# 专注于大批量、高并发的容器部署场景

# 批量部署测试用例 - 按 NUMA 拓扑分类
bulk_deployment_tests_2numa:
  # 标准配置 - 2NUMA 批量测试
  - id: "BULK-2N-01"
    name: "2NUMA小容器Guaranteed批量部署"
    machine_config: "2numa_48"
    config_category: "standard"
    numa_topology_type: "2numa"
    qos_type: "guaranteed"
    replica_count: 50
    resource_config:
      cpu_request: "1"
      cpu_limit: "1"
      memory_request: "2Gi"
      memory_limit: "2Gi"
    expected_behavior:
      all_scheduled: true
      numa_balanced: true
      affinity_applied: true
    validation_methods:
      - "numa_balance_check"
      - "affinity_verification"
      - "qos_classification"
    test_category: "bulk_guaranteed_small"
    deployment_strategy: "parallel"
    
  - id: "BULK-2N-02"
    name: "2NUMA中等容器Guaranteed批量部署"
    machine_config: "2numa_48"
    config_category: "standard"
    numa_topology_type: "2numa"
    qos_type: "guaranteed"
    replica_count: 20
    resource_config:
      cpu_request: "2"
      cpu_limit: "2"
      memory_request: "4Gi"
      memory_limit: "4Gi"
    expected_behavior:
      all_scheduled: true
      numa_balanced: true
      affinity_applied: true
    validation_methods:
      - "numa_balance_check"
      - "affinity_verification"
    test_category: "bulk_guaranteed_medium"
    deployment_strategy: "parallel"
    
  - id: "BULK-01"
    name: "2NUMA小容器批量亲和"
    machine_config: "2numa_48"
    config_category: "standard"
    numa_topology_type: "2numa"
    qos_type: "guaranteed"
    replica_count: 50
    resource_config:
      cpu_request: "1"
      cpu_limit: "1"
      memory_request: "2Gi"
      memory_limit: "2Gi"
    expected_behavior:
      all_scheduled: true
      numa_balanced: true
      affinity_applied: true
    validation_methods:
      - "numa_balance_check"
      - "affinity_verification"
    test_category: "bulk_guaranteed_small"
    deployment_strategy: "parallel"
    markers: ["bulk_deployment", "2numa", "guaranteed_qos", "small_containers", "numa_balance"]

  - id: "BULK-02"
    name: "2NUMA中等容器批量亲和"
    machine_config: "2numa_48"
    config_category: "standard"
    numa_topology_type: "2numa"
    qos_type: "guaranteed"
    replica_count: 20
    resource_config:
      cpu_request: "2"
      cpu_limit: "2"
      memory_request: "4Gi"
      memory_limit: "4Gi"
    expected_behavior:
      all_scheduled: true
      numa_balanced: true
      affinity_applied: true
    validation_methods:
      - "numa_balance_check"
      - "affinity_verification"
    test_category: "bulk_guaranteed_medium"
    deployment_strategy: "parallel"
    markers: ["bulk_deployment", "2numa", "guaranteed_qos", "medium_containers", "numa_balance"]

  - id: "BULK-03"
    name: "2NUMA弹性容器批量亲和"
    machine_config: "2numa_48"
    config_category: "standard"
    numa_topology_type: "2numa"
    qos_type: "burstable"
    replica_count: 10
    resource_config:
      cpu_request: "1"
      cpu_limit: "2"
      memory_request: "2Gi"
      memory_limit: "4Gi"
    expected_behavior:
      all_scheduled: true
      numa_balanced: true
      affinity_applied: true
    validation_methods:
      - "numa_balance_check"
      - "affinity_verification"
    test_category: "bulk_burstable"
    deployment_strategy: "parallel"
    markers: ["bulk_deployment", "2numa", "burstable_qos", "elastic_containers", "numa_balance"]

  - id: "BULK-04"
    name: "2NUMA BestEffort批量调度"
    machine_config: "2numa_48"
    config_category: "standard"
    numa_topology_type: "2numa"
    qos_type: "besteffort"
    replica_count: 100
    resource_config:
      cpu_request: ""
      cpu_limit: ""
      memory_request: ""
      memory_limit: ""
    expected_behavior:
      all_scheduled: true
      numa_balanced: false
      affinity_applied: false
    validation_methods:
      - "no_affinity_check"
    test_category: "bulk_besteffort"
    deployment_strategy: "parallel"
    markers: ["bulk_deployment", "2numa", "besteffort_qos", "no_affinity"]

  - id: "BULK-2N-03"
    name: "2NUMA混合QoS批量部署"
    machine_config: "2numa_48"
    config_category: "standard"
    numa_topology_type: "2numa"
    qos_type: "mixed"
    replica_count: 30
    resource_config:
      guaranteed_replicas: 10
      burstable_replicas: 15
      besteffort_replicas: 5
