    numa_topology_type: "2numa"
    qos_type: "guaranteed"
    replica_count: 100
    resource_config:
      cpu_request: "2"
      cpu_limit: "2"
      memory_request: "4Gi"
      memory_limit: "4Gi"
    expected_behavior:
      all_scheduled: true
      numa_balanced: true
      affinity_applied: true
    validation_methods:
      - "numa_balance_check"
      - "affinity_verification"
