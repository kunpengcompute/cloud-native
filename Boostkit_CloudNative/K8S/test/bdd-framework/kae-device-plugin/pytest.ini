[pytest]
# BDD 测试框架演示项目的 pytest 配置

# 测试发现模式
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# BDD 特定配置
# bdd_features_base_dir = features/  # 注释掉，避免路径重复

# 测试标记
markers =
    demo: Demo tests showcasing framework features
    basic: Basic deployment tests
    annotation: Annotation configuration tests
    env-vars: Environment variable tests
    qos: QoS class tests
    burstable: Burstable QoS tests
    combined: Combined configuration tests
    multi-replica: Multiple replica deployment tests
    smoke: Quick smoke tests

# 测试输出配置
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

