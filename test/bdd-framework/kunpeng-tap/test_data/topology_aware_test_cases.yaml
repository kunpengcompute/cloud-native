    numa_count: 4
    cores_per_numa: 80
    total_cores: 320
    socket_count: 2
    cores_per_socket: 160
    numa_topology:
      numa0: "0-79"
      numa1: "80-159"
      numa2: "160-239"
      numa3: "240-319"
    socket_topology:
      socket0: "0-159"
      socket1: "160-319"
    memory_per_numa: "64Gi"
    total_memory: "256Gi"

# QoS 类型定义
qos_types:
  guaranteed:
    description: "Guaranteed QoS - requests = limits"
    expected_affinity: true
    test_configs:
      small:
        cpu_request: "1"
        cpu_limit: "1"
        memory_request: "2Gi"
        memory_limit: "2Gi"
      medium:
        cpu_request: "4"
        cpu_limit: "4"
        memory_request: "8Gi"
        memory_limit: "8Gi"
      large:
        cpu_request: "24"
        cpu_limit: "24"
        memory_request: "32Gi"
        memory_limit: "32Gi"
      
  burstable:
    description: "Burstable QoS - requests < limits"
    expected_affinity: true
    test_configs:
      small:
        cpu_request: "0.5"
        cpu_limit: "1"
        memory_request: "1Gi"
        memory_limit: "2Gi"
      medium:
        cpu_request: "2"
        cpu_limit: "4"
        memory_request: "4Gi"
        memory_limit: "8Gi"
      large:
        cpu_request: "12"
        cpu_limit: "24"
        memory_request: "16Gi"
        memory_limit: "32Gi"
        
  besteffort:
    description: "BestEffort QoS - 无 requests 和 limits"
    expected_affinity: false
    test_configs:
      default:
        # 不设置任何资源限制
        cpu_request: null
        cpu_limit: null
        memory_request: null
        memory_limit: null

# 拓扑级别定义
topology_levels:
  CLUSTER:
    description: "集群级别 - 可以调度到任意节点"
    validation_method: "cluster_level_check"
  NUMA:
    description: "NUMA 节点级别 - 应该在单个 NUMA 内"
    validation_method: "numa_affinity_check"
  SOCKET:
    description: "SOCKET 级别 - 应该在单个 SOCKET 内"
    validation_method: "socket_affinity_check"
  CROSS_NUMA:
    description: "跨 NUMA - 跨越多个 NUMA 节点"
    validation_method: "cross_numa_check"
  CROSS_SOCKET:
    description: "跨 SOCKET - 跨越多个 SOCKET"
    validation_method: "cross_socket_check"

# 功能测试用例 - 按 NUMA 拓扑分类
# 完全对应 TESTCASE.md 中的测试用例定义
