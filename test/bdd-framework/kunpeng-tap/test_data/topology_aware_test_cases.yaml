# kunpeng-tap 拓扑感知测试用例配置
# 专注于 QoS 类型和拓扑亲和验证

# NUMA 拓扑分类
numa_topology_categories:
  2numa:
    name: "2NUMA 拓扑"
    description: "双 NUMA 节点配置"
    configs: ["2numa_48", "2numa_160"]
  4numa:
    name: "4NUMA 拓扑"
    description: "四 NUMA 节点配置"
    configs: ["4numa_24", "4numa_80"]

# 机器配置分类
machine_config_categories:
  standard:
    name: "标准配置"
    description: "适用于标准测试环境的机器配置"
    configs:
      2numa_48:
        name: "2NUMA-48核"
        numa_count: 2
        cores_per_numa: 48
        total_cores: 96
        numa_topology:
          numa0: "0-47"
          numa1: "48-95"
        memory_per_numa: "32Gi"
        total_memory: "64Gi"

      4numa_24:
        name: "4NUMA-24核"
        numa_count: 4
        cores_per_numa: 24
        total_cores: 96
        socket_count: 2
        cores_per_socket: 48
        numa_topology:
          numa0: "0-23"
          numa1: "24-47"
          numa2: "48-71"
          numa3: "72-95"
        socket_topology:
          socket0: "0-47"
          socket1: "48-95"
        memory_per_numa: "16Gi"
        total_memory: "64Gi"

  high_perf:
    name: "高性能配置"
    description: "适用于高性能测试环境的机器配置"
    configs:
      2numa_160:
        name: "2NUMA-160核"
        numa_count: 2
        cores_per_numa: 160
        total_cores: 320
        numa_topology:
          numa0: "0-159"
          numa1: "160-319"
        memory_per_numa: "128Gi"
        total_memory: "256Gi"

      4numa_80:
        name: "4NUMA-80核"
        numa_count: 4
        cores_per_numa: 80
        total_cores: 320
        socket_count: 2
        cores_per_socket: 160
        numa_topology:
          numa0: "0-79"
          numa1: "80-159"
          numa2: "160-239"
          numa3: "240-319"
        socket_topology:
          socket0: "0-159"
          socket1: "160-319"
        memory_per_numa: "64Gi"
        total_memory: "256Gi"

# 兼容性：保留原有的 machine_configs 结构
machine_configs:
  2numa_48:
    name: "2NUMA-48核"
    category: "standard"
    numa_topology_type: "2numa"
    numa_count: 2
    cores_per_numa: 48
    total_cores: 96
    numa_topology:
      numa0: "0-47"
      numa1: "48-95"
    memory_per_numa: "32Gi"
    total_memory: "64Gi"

  2numa_160:
    name: "2NUMA-160核"
    category: "high_perf"
    numa_topology_type: "2numa"
    numa_count: 2
    cores_per_numa: 160
    total_cores: 320
    numa_topology:
      numa0: "0-159"
      numa1: "160-319"
    memory_per_numa: "128Gi"
    total_memory: "256Gi"

  4numa_24:
    name: "4NUMA-24核"
    category: "standard"
    numa_topology_type: "4numa"
    numa_count: 4
    cores_per_numa: 24
    total_cores: 96
    socket_count: 2
    cores_per_socket: 48
    numa_topology:
      numa0: "0-23"
      numa1: "24-47"
      numa2: "48-71"
      numa3: "72-95"
    socket_topology:
      socket0: "0-47"
      socket1: "48-95"
    memory_per_numa: "16Gi"
    total_memory: "64Gi"

  4numa_80:
