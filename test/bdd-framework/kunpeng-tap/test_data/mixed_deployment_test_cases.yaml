# 3.2 Socket 亲和后的资源竞争测试
mixed_deployment_socket_affinity:
  - id: "MIX-SK-GA-01"
    name: "Socket亲和后NUMA负载均衡"
    machine_config: "4numa_24"
    existing_containers:
      - socket: "socket0"
        cpu_request: "40"
        cpu_limit: "40"
        qos: "guaranteed"
    new_container:
      cpu_request: "4"
      cpu_limit: "4"
      qos: "guaranteed"
    expected_affinity: "numa"
    expected_socket: "socket1"
    expected_behavior: "affinity_expected"
    test_target: "NUMA亲和负载均衡"
    note: "其他Socket/NUMA内剩余充足"
    markers: ["mixed_deployment", "4numa", "guaranteed_qos", "socket_affinity", "load_balancing"]

  - id: "MIX-SK-BU-01"
    name: "Burstable Socket亲和后NUMA负载均衡"
    machine_config: "4numa_24"
    existing_containers:
      - socket: "socket0"
        cpu_request: "40"
        cpu_limit: "40"
        qos: "burstable"
      - socket: "socket1"
        cpu_request: "40"
        cpu_limit: "40"
        qos: "burstable"
    new_container:
      cpu_request: "4"
      cpu_limit: "8"
      qos: "burstable"
    expected_affinity: "numa"
    expected_behavior: "affinity_expected"
    test_target: "NUMA亲和负载均衡"
    note: "Socket/NUMA内剩余充足"
    markers: ["mixed_deployment", "4numa", "burstable_qos", "socket_affinity", "load_balancing"]

