# kunpeng-tap 混合部署测试用例配置
# 测试在已有容器占用资源的情况下，新容器的拓扑亲和行为

# 3.1 NUMA 亲和后的资源竞争测试 - 2NUMA Guaranteed
mixed_deployment_2numa_guaranteed:
  - id: "MIX-2N-01"
    name: "小资源在已占用NUMA内亲和"
    machine_config: "2numa_48"
    existing_containers:
      - numa: "numa0"
        cpu_request: "20"
        cpu_limit: "20"
        qos: "guaranteed"
      - numa: "numa1"
        cpu_request: "20"
        cpu_limit: "20"
        qos: "guaranteed"
    new_container:
      cpu_request: "4"
      cpu_limit: "4"
      qos: "guaranteed"
    expected_affinity: "numa"  # NUMA#0或NUMA#1
    expected_behavior: "affinity_expected"
    test_target: "小资源在已占用NUMA内亲和"
    note: "NUMA内剩余资源充足"
    markers: ["mixed_deployment", "2numa", "guaranteed_qos", "numa_affinity", "resource_competition"]

  - id: "MIX-2N-02"
    name: "大资源选择剩余较多NUMA"
    machine_config: "2numa_48"
    existing_containers:
      - numa: "numa0"
        cpu_request: "40"
        cpu_limit: "40"
        qos: "guaranteed"
      - numa: "numa1"
        cpu_request: "30"
        cpu_limit: "30"
        qos: "guaranteed"
    new_container:
      cpu_request: "20"
      cpu_limit: "20"
      qos: "guaranteed"
    expected_affinity: "numa"  # NUMA#1
    expected_numa: "numa1"
    expected_behavior: "affinity_expected"
    test_target: "大资源选择剩余较多NUMA"
    note: "负载均衡策略"
    markers: ["mixed_deployment", "2numa", "guaranteed_qos", "numa_affinity", "load_balancing"]

  - id: "MIX-2N-04"
    name: "资源不足时跨NUMA调度"
    machine_config: "2numa_48"
    existing_containers:
      - numa: "numa0"
        cpu_request: "45"
        cpu_limit: "45"
        qos: "guaranteed"
      - numa: "numa1"
        cpu_request: "45"
        cpu_limit: "45"
        qos: "guaranteed"
    new_container:
      cpu_request: "8"
      cpu_limit: "8"
      qos: "guaranteed"
    expected_affinity: "cross_numa"
    expected_behavior: "cross_numa_expected"
    test_target: "资源不足时跨NUMA调度"
    note: "单NUMA剩余不足"
    markers: ["mixed_deployment", "2numa", "guaranteed_qos", "cross_numa", "resource_shortage"]

  - id: "MIX-2N-05"
    name: "大容器必须跨NUMA"
    machine_config: "2numa_48"
    existing_containers:
      - numa: "numa0"
        cpu_request: "10"
        cpu_limit: "10"
        qos: "guaranteed"
      - numa: "numa1"
        cpu_request: "10"
        cpu_limit: "10"
        qos: "guaranteed"
    new_container:
      cpu_request: "49"
      cpu_limit: "49"
      qos: "guaranteed"
    expected_affinity: "cross_numa"
    expected_behavior: "cross_numa_expected"
    test_target: "大容器必须跨NUMA"
    note: "超出单NUMA剩余容量"
    markers: ["mixed_deployment", "2numa", "guaranteed_qos", "cross_numa", "large_container"]

  - id: "MIX-2N-06"
    name: "单NUMA剩余不足切换NUMA"
    machine_config: "2numa_48"
    existing_containers:
      - numa: "numa0"
        cpu_request: "49"
        cpu_limit: "49"
        qos: "guaranteed"
    new_container:
      cpu_request: "10"
      cpu_limit: "10"
      qos: "guaranteed"
    expected_affinity: "numa"
    expected_numa: "numa1"
    expected_behavior: "affinity_expected"
    test_target: "单NUMA剩余不足"
    note: "NUMA#0剩余不足，切换NUMA"
    markers: ["mixed_deployment", "2numa", "guaranteed_qos", "numa_switch", "resource_shortage"]

# 3.1 NUMA 亲和后的资源竞争测试 - 2NUMA Burstable
mixed_deployment_2numa_burstable:
  - id: "MIX-2N-07"
    name: "Burstable中等资源NUMA亲和"
    machine_config: "2numa_48"
    existing_containers:
      - numa: "numa0"
        cpu_request: "10"
        cpu_limit: "20"
        qos: "burstable"
      - numa: "numa1"
        cpu_request: "10"
        cpu_limit: "20"
        qos: "burstable"
    new_container:
      cpu_request: "5"
      cpu_limit: "10"
      qos: "burstable"
    expected_affinity: "numa"
    expected_behavior: "affinity_expected"
    test_target: "中等资源切换到空闲NUMA"
    note: "NUMA内剩余资源充足"
    markers: ["mixed_deployment", "2numa", "burstable_qos", "numa_affinity", "resource_competition"]

  - id: "MIX-2N-08"
    name: "Burstable大资源选择剩余较多NUMA"
    machine_config: "2numa_48"
    existing_containers:
      - numa: "numa0"
        cpu_request: "10"
        cpu_limit: "40"
        qos: "burstable"
      - numa: "numa1"
        cpu_request: "10"
        cpu_limit: "30"
        qos: "burstable"
    new_container:
      cpu_request: "10"
      cpu_limit: "20"
      qos: "burstable"
    expected_affinity: "numa"
    expected_numa: "numa1"
    expected_behavior: "affinity_expected"
    test_target: "大资源选择剩余较多NUMA"
    note: "负载均衡策略"
    markers: ["mixed_deployment", "2numa", "burstable_qos", "numa_affinity", "load_balancing"]

  - id: "MIX-2N-09"
    name: "Burstable requests充足limits超出"
    machine_config: "2numa_48"
    existing_containers:
      - numa: "numa0"
        cpu_request: "10"
        cpu_limit: "45"
        qos: "burstable"
      - numa: "numa1"
        cpu_request: "10"
        cpu_limit: "45"
        qos: "burstable"
    new_container:
